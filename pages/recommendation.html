<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daily Recommendations</title>
    <style>
      body {
        width: 24rem;
        padding: 1.25rem;
        background: white;
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: auto;
        max-height: 600px;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      "
    >
      <h2 style="color: #2563eb; font-size: 1.25rem; margin: 0">
        Today's Picks
      </h2>
      <a
        href="../popup.html"
        style="text-decoration: none; color: #6b7280; font-size: 0.875rem"
        >Close</a
      >
    </div>

    <div
      id="rec-list"
      style="
        display: flex;
        flex-direction: column;
        gap: 1rem;
        overflow-y: auto;
        padding-right: 0.25rem;
      "
    >
      <!-- Content injected by JS -->
      <div style="text-align: center; color: #9ca3af; padding: 2rem">
        Loading recommendations...
      </div>
    </div>

    <script src="recommendation.js"></script>
  </body>
</html>
