<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Practice</title>
    <style>
      body {
        width: 24rem;
        padding: 1.25rem;
        background: white;
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        box-sizing: border-box;
      }
      .tab-btn {
        flex: 1;
        padding: 0.75rem 0;
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: #9ca3af;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
      }
      .tab-btn:hover {
        color: #2563eb;
      }
      .tab-btn.active {
        color: #2563eb;
        border-color: #2563eb;
      }
      .char-hint {
        display: inline-flex;
        width: 2rem;
        height: 2.5rem;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        background: #f3f4f6;
        border-radius: 4px;
        margin: 2px;
      }
      .char-input {
        width: 2rem;
        height: 2.5rem;
        text-align: center;
        font-size: 1.1rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        margin: 2px;
        outline: none;
        cursor: pointer;
        caret-color: transparent;
      }
      .char-input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 2px #bfdbfe;
      }
      .char-opt {
        transition: transform 0.1s;
      }
      .char-opt:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      "
    >
      <h2 style="color: #2563eb; margin: 0; font-size: 1.25rem">Practice</h2>
      <span
        id="progress-counter"
        style="color: #6b7280; font-size: 0.9rem; font-weight: 500"
        >(0/0)</span
      >
    </div>

    <div
      style="
        display: flex;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 1.5rem;
      "
    >
      <button
        class="tab-btn"
        data-tab-target="translation"
        style="color: #2563eb; border-color: #2563eb"
      >
        Translation
      </button>
      <button class="tab-btn" data-tab-target="definition">Definition</button>
      <button class="tab-btn" data-tab-target="fill-blank">Fill Blank</button>
    </div>

    <!-- Translation View -->
    <div id="translation-content">
      <p style="text-align: center; color: #4b5563; margin-bottom: 0.5rem">
        Translate this word:
      </p>
      <h3
        style="
          text-align: center;
          color: #111827;
          font-size: 1.5rem;
          margin: 0 0 1.5rem 0;
        "
      >
        <span style="border-bottom: 2px dashed #9ca3af"></span>
      </h3>
      <input
        type="text"
        placeholder="Type answer here..."
        style="
          width: 100%;
          padding: 0.75rem;
          border: 1px solid #d1d5db;
          border-radius: 0.5rem;
          font-size: 1rem;
          box-sizing: border-box;
          outline: none;
        "
      />
    </div>

    <!-- Definition View -->
    <div id="definition-content" style="display: none">
      <p style="text-align: center; color: #4b5563; margin-bottom: 1rem">
        Choose definition for:
        <span
          style="font-weight: 700; color: #2563eb; font-size: 1.1rem"
        ></span>
      </p>
      <div style="display: flex; flex-direction: column; gap: 0.5rem"></div>
    </div>

    <!-- Fill Blank View -->
    <div id="fill-blank-content" style="display: none">
      <p
        style="
          font-size: 0.95rem;
          color: #374151;
          text-align: center;
          margin-bottom: 1.5rem;
          line-height: 1.5;
          font-style: italic;
          background: #f9fafb;
          padding: 0.5rem;
          border-radius: 0.375rem;
        "
      ></p>
      <div
        id="fill-blank-inputs"
        style="
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          margin-bottom: 1.5rem;
        "
      ></div>
      <div
        id="fill-blank-options"
        style="
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 0.5rem;
        "
      ></div>
    </div>

    <div
      id="action-container"
      style="
        margin-top: 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <button
        class="wwise-link-btn"
        style="
          background: none;
          border: none;
          color: #6b7280;
          cursor: pointer;
          font-size: 0.9rem;
        "
      >
        Skip
      </button>
      <button
        class="wwise-btn-primary"
        style="
          background: #2563eb;
          color: white;
          padding: 0.6rem 1.5rem;
          border: none;
          border-radius: 0.5rem;
          cursor: pointer;
          font-weight: 600;
          font-size: 0.95rem;
        "
      >
        Check
      </button>
    </div>

    <script src="practice.js"></script>
  </body>
</html>
