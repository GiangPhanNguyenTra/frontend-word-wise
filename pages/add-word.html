<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script defer src="add-word.js"></script>
    <title>Add Word</title>
    <style>
      /* 
        Sử dụng một class có tiền tố độc nhất "wwise-" để xử lý :hover,
        tránh xung đột với CSS của trang web gốc.
      */
      .wwise-btn-primary {
        /* Hiệu ứng chuyển màu mượt mà */
        transition: background-color 0.2s ease-in-out;
      }
      .wwise-btn-primary:hover {
        background-color: #2563eb !important; /* Tailwind's blue-600 */
      }
    </style>
  </head>
  <body
    style="
      padding: 1rem; /* p-4 */
      background-color: #ffffff; /* bg-white */
      border-radius: 0.5rem; /* rounded-lg */
      width: 24rem; /* w-96 */
      font-family: ui-sans-serif, system-ui, sans-serif; /* font-sans mặc định */
    "
  >
    <h1
      style="
        color: #2563eb; /* text-blue-600 */
        font-weight: 600; /* font-semibold */
        font-size: 1.25rem; /* text-xl */
        line-height: 1.75rem;
        margin-bottom: 1rem; /* mb-4 */
      "
    >
      Word Wise
    </h1>
    <h2
      style="
        font-weight: 700; /* font-bold */
        font-size: 1.125rem; /* text-lg */
        line-height: 1.75rem;
        margin-bottom: 0.5rem; /* mb-2 */
      "
    >
      Add New Word
    </h2>

    <div id="word-container" style="display: none; /* class 'hidden' */">
      <div
        id="word"
        style="
          font-size: 1.125rem; /* text-lg */
          line-height: 1.75rem;
          font-weight: 600; /* font-semibold */
          color: #1d4ed8; /* text-blue-700 */
        "
      ></div>
      <div
        id="translation"
        style="
          color: #4b5563; /* text-gray-600 */
          font-size: 0.875rem; /* text-sm */
          line-height: 1.25rem;
          margin-bottom: 0.5rem; /* mb-2 */
        "
      >
        : <span>tạm dịch</span>
      </div>

      <textarea
        id="context"
        style="
          width: 100%; /* w-full */
          border: 1px solid #d1d5db; /* border */
          border-radius: 0.5rem; /* rounded-lg */
          padding: 0.5rem; /* p-2 */
          margin-bottom: 0.75rem; /* mb-3 */
          font-size: 0.875rem; /* text-sm */
          line-height: 1.25rem;
          box-sizing: border-box; /* Thêm để padding không làm tăng kích thước */
        "
      ></textarea>

      <div
        style="
          display: flex; /* flex */
          flex-wrap: wrap; /* flex-wrap */
          gap: 0.5rem; /* gap-2 */
          margin-bottom: 1rem; /* mb-4 */
        "
      >
        <span
          style="
            padding-left: 0.75rem; /* px-3 */
            padding-right: 0.75rem;
            padding-top: 0.25rem; /* py-1 */
            padding-bottom: 0.25rem;
            background-color: #dbeafe; /* bg-blue-100 */
            color: #2563eb; /* text-blue-600 */
            border-radius: 9999px; /* rounded-full */
            font-size: 0.75rem; /* text-xs */
            line-height: 1rem;
          "
          >Science</span
        >
        <span
          style="
            padding-left: 0.75rem;
            padding-right: 0.75rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
            background-color: #dbeafe;
            color: #2563eb;
            border-radius: 9999px;
            font-size: 0.75rem;
            line-height: 1rem;
          "
          >Technology</span
        >
        <span
          style="
            padding-left: 0.75rem;
            padding-right: 0.75rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
            background-color: #dbeafe;
            color: #2563eb;
            border-radius: 9999px;
            font-size: 0.75rem;
            line-height: 1rem;
          "
          >Family</span
        >
      </div>

      <div style="display: flex; gap: 0.5rem; /* gap-2 */">
        <button
          style="
            flex: 1 1 0%; /* flex-1 */
            background-color: #e5e7eb; /* bg-gray-200 */
            padding-top: 0.5rem; /* py-2 */
            padding-bottom: 0.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            border: none;
            cursor: pointer;
          "
        >
          Cancel
        </button>
        <button
          id="add-btn"
          class="wwise-btn-primary"
          style="
            flex: 1 1 0%; /* flex-1 */
            background-color: #3b82f6; /* bg-blue-500 */
            color: #ffffff; /* text-white */
            padding-top: 0.5rem; /* py-2 */
            padding-bottom: 0.5rem;
            border-radius: 0.5rem; /* rounded-lg */
            border: none;
            cursor: pointer;
          "
        >
          Add to collection
        </button>
      </div>
    </div>

    <div
      id="empty-state"
      style="
        color: #6b7280; /* text-gray-500 */
        text-align: center; /* text-center */
        margin-top: 2.5rem; /* mt-10 */
      "
    >
      Highlight any word on a webpage to save it with context.
    </div>
  </body>
</html>
