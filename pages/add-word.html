<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Word</title>
    <style>
      body {
        width: 24rem;
        padding: 1.25rem;
        background-color: white;
        font-family: ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        box-sizing: border-box;
      }
      .wwise-btn:hover {
        opacity: 0.9;
      }
      .tag-item {
        cursor: pointer;
        transition: all 0.2s;
        border: 1px solid transparent;
        user-select: none;
      }
      .tag-item:hover {
        background-color: #bfdbfe !important;
      }
      .tag-item.selected {
        background-color: #2563eb !important;
        color: white !important;
      }
      textarea:focus {
        outline: 2px solid #3b82f6;
        border-color: transparent;
      }

      /* Loader CSS */
      .loader {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 16px;
        height: 16px;
        animation: spin 1s linear infinite;
        display: inline-block;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .skeleton-text {
        background-color: #e5e7eb;
        height: 1rem;
        width: 100%;
        border-radius: 0.25rem;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="content-area">
      <h2
        style="
          color: #2563eb;
          font-size: 1.25rem;
          font-weight: 700;
          margin: 0 0 1rem 0;
        "
      >
        Add New Word
      </h2>

      <div
        style="
          background: #f9fafb;
          padding: 1rem;
          border-radius: 0.5rem;
          margin-bottom: 1rem;
          border: 1px solid #e5e7eb;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.5rem;
          "
        >
          <span
            id="word-display"
            style="font-size: 1.5rem; font-weight: 700; color: #111827"
          ></span>
          <span
            id="phonetic-display"
            style="color: #6b7280; font-family: monospace; font-size: 0.9rem"
          ></span>
        </div>

        <!-- Translation Loading Area -->
        <div id="translation-loading" style="display: block">
          <div
            style="
              display: flex;
              align-items: center;
              gap: 0.5rem;
              margin-bottom: 0.5rem;
            "
          >
            <div class="loader"></div>
            <span style="color: #6b7280; font-size: 0.85rem"
              >Translating...</span
            >
          </div>
        </div>

        <!-- Translation Result Area -->
        <div id="translation-result" style="display: none">
          <div style="margin-bottom: 0.5rem">
            <span
              style="
                background: #e0e7ff;
                color: #4338ca;
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 0.75rem;
                font-weight: 600;
              "
              >VN</span
            >
            <span
              id="vn-meaning"
              style="color: #374151; font-weight: 500; margin-left: 0.5rem"
            ></span>
          </div>
          <p
            id="vi-def"
            style="
              color: #4b5563;
              font-size: 0.9rem;
              line-height: 1.4;
              margin: 0;
              font-style: italic;
            "
          ></p>
        </div>
      </div>

      <label
        style="
          font-size: 0.875rem;
          font-weight: 600;
          color: #374151;
          display: block;
          margin-bottom: 0.5rem;
        "
        >Context / Example</label
      >
      <textarea
        id="context-input"
        rows="3"
        style="
          width: 100%;
          padding: 0.5rem;
          border: 1px solid #d1d5db;
          border-radius: 0.375rem;
          font-family: inherit;
          font-size: 0.9rem;
          margin-bottom: 1rem;
          box-sizing: border-box;
          resize: vertical;
        "
      ></textarea>

      <label
        style="
          font-size: 0.875rem;
          font-weight: 600;
          color: #374151;
          display: block;
          margin-bottom: 0.5rem;
        "
        >Save to Collection</label
      >
      <div
        id="tags-container"
        style="
          display: flex;
          flex-wrap: wrap;
          gap: 0.5rem;
          margin-bottom: 1.5rem;
          max-height: 80px;
          overflow-y: auto;
          padding: 2px;
        "
      >
        <span style="font-size: 0.85rem; color: #9ca3af"
          >Loading collections...</span
        >
      </div>

      <div style="display: flex; gap: 0.75rem">
        <button
          id="cancel-btn"
          class="wwise-btn"
          style="
            flex: 1;
            padding: 0.6rem;
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
          "
        >
          Cancel
        </button>
        <button
          id="save-btn"
          class="wwise-btn"
          style="
            flex: 1;
            padding: 0.6rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-weight: 500;
          "
          disabled
        >
          Save Word
        </button>
      </div>
    </div>

    <div
      id="message-area"
      style="
        display: none;
        height: 100vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      "
    >
      <h3 style="color: #16a34a; font-size: 1.25rem; margin-bottom: 0.5rem">
        Success!
      </h3>
      <p style="color: #4b5563">The word has been added to your collection.</p>
    </div>

    <script src="add-word.js"></script>
  </body>
</html>
